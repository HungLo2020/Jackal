[package]
name = "jackal-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
minifb = "0.28"
rodio = "0.20.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hound = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
x11-dl = "2.21"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
